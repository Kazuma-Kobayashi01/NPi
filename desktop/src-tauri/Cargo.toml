[package]
name = "omp-desktop"
version = "3.1.0-101"
edition = "2021"

[lib]
name = "omp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
# Option+Space opens the quick-ask window (`src/quick_ask.rs`).
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
# 2.13: `check()` no longer sets SSL_CERT_FILE/SSL_CERT_DIR process-wide on
# Linux, which every omp child would have inherited.
tauri-plugin-updater = "2.13"
serde = { version = "1", features = ["derive"] }
# `raw_value`: the conversation tree skips message bodies it does not read.
serde_json = { version = "1", features = ["raw_value"] }
notify = "8"
gix = "0.87"
open = { version = "5", features = ["shellexecute-on-windows"] }
sha2 = "0.11"
# Read-only access to omp's own `agent.db` (model MRU for the picker, #11).
# `bundled` compiles SQLite in, so no system library is needed on any OS.
rusqlite = { version = "0.40", features = ["bundled"] }
# The terminal panel's pseudo-terminal (`src/terminal/`): a shell per tab.
portable-pty = "0.9"
# Terminal output travels as base64 in JSON event payloads. Already in the
# tree via tauri (same 0.22 line, so no new package).
base64 = "0.22"
# Agent-facing CDP endpoint (`browser/proxy/ws.rs`): the server side of the
# agent's plain `ws://` loopback connection, so `handshake` only - no TLS.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# HTTP client for chat image fetching with strict public DNS/IP pinning.
# Uses reqwest 0.13 already resolved in Cargo.lock with blocking and rustls.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
# Real deadline enforcement for chat image admission and blocking DNS joins,
# on the same Tauri/Tokio runtime (time only; the runtime features are already
# enabled by Tauri/reqwest). Already resolved in Cargo.lock.
tokio = { version = "1", features = ["time"] }
# URL parsing for chat image targets and redirect validation. Already in Cargo.lock.
url = "2"
# Archive extraction for the bundled Python runtime (`src/python_runtime/`).
# Both are already resolved in Cargo.lock.
flate2 = "1"
tar = "0.4"

# Text from the PDFs in an Academic project's `papers/` (`src/pdf_text.rs`): pure Rust
# (MIT, on lopdf), reads CJK text and tells scanned pages from text ones.
pdf-inspector = "=1.25.0"

# Citation styles for the Librarian (`src/librarian/format.rs`): a CSL engine with
# the bundled style archive (APA, IEEE, Chicago, MLA, Nature, Vancouver, Harvard,
# GB/T 7714 and more; the styles are CC-BY-SA, see THIRD_PARTY_NOTICES.md).
hayagriva = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
# Machine/user PATH for omp and git children (`child_path.rs`, #34). Already
# in the tree via reqwest → hyper-util.
windows-registry = "0.6"

# Folder "Open with" on Windows/Linux launches the executable with the path
# in argv; this forwards it to the already-running instance instead of
# starting a second app. macOS routes the same request through
# `RunEvent::Opened` and needs no plugin - see `src/external_open.rs`.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Real notification permission and clicks on macOS (`src/notify/macos.rs`);
# the versions already in the tree through tauri/wry.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSError", "NSGeometry", "NSObject", "NSString"] }
# The quick-ask panel and its Liquid Glass (`src/quick_ask_glass.rs`).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-quartz-core", "NSGlassEffectView", "NSGraphics", "NSPanel", "NSResponder", "NSView", "NSVisualEffectView", "NSWindow"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Decode screenshot pixels in real-Chromium annotate regression tests
# (`base64` comes from the normal dependencies).
[dev-dependencies]
png = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
